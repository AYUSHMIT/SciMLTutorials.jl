<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9558B2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4063D8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#grad1)"/>
  
  <!-- SciML Logo/Text -->
  <text x="400" y="200" font-family="Arial, sans-serif" font-size="72" font-weight="bold" 
        fill="white" text-anchor="middle">SciML</text>
  
  <!-- Tagline -->
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="36" 
        fill="white" text-anchor="middle" opacity="0.9">
    Scientific Machine Learning
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="330" font-family="Arial, sans-serif" font-size="24" 
        fill="white" text-anchor="middle" opacity="0.8">
    Exploratory Showcase
  </text>
  
  <!-- Decorative equation -->
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="32" 
        fill="white" text-anchor="middle" opacity="0.6" font-style="italic">
    ∂u/∂t = f(u, p, t)
  </text>
  
  <!-- Icons/Symbols -->
  <circle cx="150" cy="450" r="30" fill="white" opacity="0.3"/>
  <circle cx="650" cy="450" r="30" fill="white" opacity="0.3"/>
  <circle cx="400" cy="500" r="20" fill="white" opacity="0.3"/>
  
  <!-- Footer -->
  <text x="400" y="560" font-family="Arial, sans-serif" font-size="18" 
        fill="white" text-anchor="middle" opacity="0.7">
    From Equations to Insights
  </text>
</svg>
